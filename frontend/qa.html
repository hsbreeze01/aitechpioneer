<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问答 - RAG 系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">RAG 系统</h1>
                <nav class="nav">
                    <a href="/index.html" class="nav-link">首页</a>
                    <a href="/documents.html" class="nav-link">文档管理</a>
                    <a href="/upload.html" class="nav-link">上传文档</a>
                    <a href="/qa.html" class="nav-link active">智能问答</a>
                </nav>
            </div>
        </header>

        <main class="main">
            <section class="qa-section">
                <h2 class="section-title">智能问答</h2>
                <p class="section-description">基于您的文档库，提出问题并获得准确答案</p>

                <div class="qa-container">
                    <div class="qa-input">
                        <div class="input-wrapper">
                            <input type="text" id="questionInput" class="qa-input-field" placeholder="输入您的问题...">
                            <button id="askBtn" class="btn btn-primary">提问</button>
                        </div>
                        <div class="qa-options">
                            <label class="checkbox-label">
                                <input type="checkbox" id="useContext" checked>
                                <span>使用上下文</span>
                            </label>
                            <div class="form-group-inline">
                                <label class="form-label">Top K:</label>
                                <input type="number" id="topK" class="form-input-small" value="5" min="1" max="20">
                            </div>
                            <div class="form-group-inline">
                                <label class="form-label">相似度阈值:</label>
                                <select id="scoreThreshold" class="form-input-small">
                                    <option value="0.3">0.3</option>
                                    <option value="0.4">0.4</option>
                                    <option value="0.5" selected>0.5</option>
                                    <option value="0.6">0.6</option>
                                    <option value="0.7">0.7</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="answerSection" class="answer-section hidden">
                        <div class="answer-header">
                            <h3 class="answer-title">答案</h3>
                            <button id="clearAnswer" class="btn btn-secondary btn-small">清除</button>
                        </div>
                        <div id="answerContent" class="answer-content">
                            <div class="loading">正在思考...</div>
                        </div>
                        <div id="answerSources" class="answer-sources hidden">
                            <h4 class="sources-title">相关来源</h4>
                            <div id="sourcesList" class="sources-list"></div>
                        </div>
                    </div>

                    <div id="historySection" class="history-section">
                        <div class="history-header">
                            <h3 class="history-title">问答历史</h3>
                            <button id="clearHistory" class="btn btn-secondary btn-small">清除历史</button>
                        </div>
                        <div id="historyList" class="history-list">
                            <div class="empty-history">暂无问答历史</div>
                        </div>
                    </div>

                    <div id="qaRecordsSection" class="qa-records-section">
                        <div class="qa-records-header">
                            <h3 class="qa-records-title">QA检索记录</h3>
                            <div class="qa-records-actions">
                                <select id="qaRecordsFilter" class="select-input">
                                    <option value="all">全部记录</option>
                                    <option value="today">今天</option>
                                    <option value="week">最近一周</option>
                                </select>
                                <button id="loadQaRecords" class="btn btn-small btn-primary">加载记录</button>
                            </div>
                        </div>
                        <div id="qaRecordsStats" class="qa-records-stats"></div>
                        <div id="qaRecordsList" class="qa-records-list">
                            <div class="empty-qa-records">暂无QA检索记录</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2025 RAG 系统. 基于 spec-workflow 驱动开发</p>
        </footer>
    </div>

    <script src="/static/js/qa.js?v=4"></script>
</body>
</html>
