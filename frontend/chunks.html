<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="管理文档的Chunk，支持编辑、合并和状态控制">
    <title>Chunk 管理 - RAG 系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header" role="banner">
            <div class="header-content">
                <a href="/index.html" class="logo" aria-label="RAG 系统首页">
                    <span class="logo-text">RAG 系统</span>
                </a>
                <nav class="nav" role="navigation" aria-label="主导航">
                    <a href="/index.html" class="nav-link">首页</a>
                    <a href="/documents.html" class="nav-link">文档管理</a>
                    <a href="/upload.html" class="nav-link">上传文档</a>
                    <a href="/qa.html" class="nav-link">智能问答</a>
                    <a href="/search.html" class="nav-link">智能检索</a>
                    <a href="/chunks.html" class="nav-link active" aria-current="page">Chunk 管理</a>
                </nav>
            </div>
        </header>

        <main class="main" role="main">
            <section class="chunks-section" aria-labelledby="chunks-title">
                <div class="section-header">
                    <div class="section-title-group">
                        <h1 id="chunks-title" class="section-title">Chunk 管理</h1>
                        <p class="section-description">管理文档的Chunk，支持编辑、合并和状态控制</p>
                    </div>
                    <div class="section-actions">
                        <div class="quick-locate">
                            <label for="documentIdInput" class="visually-hidden">输入文档ID快速定位</label>
                            <input type="text" id="documentIdInput" class="input-field" placeholder="输入文档 ID 快速定位" aria-describedby="locate-help">
                            <span id="locate-help" class="visually-hidden">输入文档ID可以快速定位到该文档的所有Chunk</span>
                            <button id="locateButton" class="btn btn-small btn-primary" aria-label="定位到指定文档">
                                <img src="/static/icons/search.svg" alt="定位" class="btn-icon-svg">
                                <span class="btn-text">定位</span>
                            </button>
                            <button id="clearLocateButton" class="btn btn-small btn-secondary" aria-label="清除文档ID筛选">清除</button>
                        </div>
                        <div class="filter-group">
                            <label for="statusFilter" class="visually-hidden">按状态筛选Chunk</label>
                            <select id="statusFilter" class="select-input" aria-describedby="status-filter-help">
                                <option value="">全部状态</option>
                                <option value="active">活跃</option>
                                <option value="deprecated">已弃用</option>
                                <option value="inactive">非活跃</option>
                            </select>
                            <span id="status-filter-help" class="visually-hidden">选择要显示的Chunk状态</span>
                        </div>
                        <div class="filter-group">
                            <label for="typeFilter" class="visually-hidden">按类型筛选Chunk</label>
                            <select id="typeFilter" class="select-input" aria-describedby="type-filter-help">
                                <option value="">全部类型</option>
                                <option value="parent">父块</option>
                                <option value="child">子块</option>
                            </select>
                            <span id="type-filter-help" class="visually-hidden">选择要显示的Chunk类型</span>
                        </div>
                        <button id="mergeButton" class="btn btn-small btn-primary" disabled aria-label="合并选中的Chunk">
                            <img src="/static/icons/link.svg" alt="合并" class="btn-icon-svg">
                            <span class="btn-text">合并选中</span>
                        </button>
                        <button id="recommendButton" class="btn btn-small btn-info" aria-label="获取智能推荐的Chunk">
                            <img src="/static/icons/search.svg" alt="" class="btn-icon-svg">
                            <span class="btn-text">智能推荐</span>
                        </button>
                        <button id="refreshButton" class="btn btn-small btn-secondary" aria-label="刷新Chunk列表">
                            <img src="/static/icons/refresh.svg" alt="刷新" class="btn-icon-svg">
                            <span class="btn-text">刷新</span>
                        </button>
                    </div>
                </div>

                <div id="recommendationsSection" class="recommendations-section hidden" role="region" aria-labelledby="recommendations-title">
                    <div class="recommendations-header">
                        <h2 id="recommendations-title" class="recommendations-title">智能推荐</h2>
                        <button id="closeRecommendations" class="btn btn-small btn-secondary" aria-label="关闭推荐列表">关闭</button>
                    </div>
                    <div id="recommendationsList" class="recommendations-list" role="list" aria-live="polite"></div>
                </div>

                <div id="chunksList" class="chunks-list" role="list" aria-live="polite">
                    <div class="loading" role="status" aria-label="正在加载Chunk列表">加载中...</div>
                </div>

                <div id="emptyState" class="empty-state hidden" role="status">
                    <div class="empty-icon" aria-hidden="true">
                        <img src="/static/icons/document.svg" alt="" class="icon-svg-large">
                    </div>
                    <h2 class="empty-title">暂无 Chunk</h2>
                    <p class="empty-description">上传文档后，系统会自动创建并管理文档的 Chunk</p>
                    <a href="/upload.html" class="btn btn-primary" aria-label="上传文档">
                        <img src="/static/icons/upload.svg" alt="" class="btn-icon-svg">
                        <span class="btn-text">上传文档</span>
                    </a>
                </div>
            </section>
        </main>

        <footer class="footer" role="contentinfo">
            <div class="footer-content">
                <p>&copy; 2025 RAG 系统. 基于 spec-workflow 驱动开发</p>
            </div>
        </footer>
    </div>

    <script src="/static/js/chunks.js"></script>
</body>
</html>
