<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunk 管理 - RAG 系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">RAG 系统</h1>
                <nav class="nav">
                    <a href="/index.html" class="nav-link">首页</a>
                    <a href="/documents.html" class="nav-link">文档管理</a>
                    <a href="/upload.html" class="nav-link">上传文档</a>
                    <a href="/qa.html" class="nav-link">智能问答</a>
                    <a href="/search.html" class="nav-link">智能检索</a>
                    <a href="/chunks.html" class="nav-link active">Chunk 管理</a>
                </nav>
            </div>
        </header>

        <main class="main">
            <section class="chunks-section">
                <div class="section-header">
                    <h2 class="section-title">Chunk 管理</h2>
                    <div class="section-actions">
                        <div class="quick-locate">
                            <input type="text" id="documentIdInput" class="input-field" placeholder="输入文档 ID 快速定位">
                            <button id="locateButton" class="btn btn-small btn-primary">定位</button>
                            <button id="clearLocateButton" class="btn btn-small btn-secondary">清除</button>
                        </div>
                        <select id="statusFilter" class="select-input">
                            <option value="">全部状态</option>
                            <option value="active">活跃</option>
                            <option value="deprecated">已弃用</option>
                            <option value="inactive">非活跃</option>
                        </select>
                        <select id="typeFilter" class="select-input">
                            <option value="">全部类型</option>
                            <option value="parent">父块</option>
                            <option value="child">子块</option>
                        </select>
                        <button id="mergeButton" class="btn btn-small btn-primary" disabled>合并选中</button>
                        <button id="recommendButton" class="btn btn-small btn-info">智能推荐</button>
                        <button id="refreshButton" class="btn btn-small btn-secondary">刷新</button>
                    </div>
                </div>

                <div id="recommendationsSection" class="recommendations-section hidden">
                    <div class="recommendations-header">
                        <h3 class="recommendations-title">智能推荐</h3>
                        <button id="closeRecommendations" class="btn btn-small btn-secondary">关闭</button>
                    </div>
                    <div id="recommendationsList" class="recommendations-list"></div>
                </div>

                <div id="chunksList" class="chunks-list">
                    <div class="loading">加载中...</div>
                </div>

                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon">📦</div>
                    <h3 class="empty-title">暂无 Chunk</h3>
                    <p class="empty-description">上传文档后，系统会自动创建并管理文档的 Chunk</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2025 RAG 系统. 基于 spec-workflow 驱动开发</p>
        </footer>
    </div>

    <script src="/static/js/chunks.js"></script>
</body>
</html>
