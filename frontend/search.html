<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能检索 - RAG 系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">RAG 系统</h1>
                <nav class="nav">
                    <a href="/index.html" class="nav-link">首页</a>
                    <a href="/documents.html" class="nav-link">文档管理</a>
                    <a href="/upload.html" class="nav-link">上传文档</a>
                    <a href="/qa.html" class="nav-link">智能问答</a>
                    <a href="/search.html" class="nav-link active">智能检索</a>
                    <a href="/chunks.html" class="nav-link">Chunk 管理</a>
                </nav>
            </div>
        </header>

        <main class="main">
            <section class="search-section">
                <div class="section-header">
                    <h2 class="section-title">智能检索</h2>
                </div>

                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="输入关键词或问题进行语义检索..."
                    >
                    <button id="searchButton" class="btn btn-primary">检索</button>
                </div>

                <div class="search-options">
                    <div class="option-group">
                        <label for="limitSelect">返回数量:</label>
                        <select id="limitSelect" class="select-input">
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="thresholdSelect">相似度阈值:</label>
                        <select id="thresholdSelect" class="select-input">
                            <option value="0.5">0.5</option>
                            <option value="0.6">0.6</option>
                            <option value="0.7" selected>0.7</option>
                            <option value="0.8">0.8</option>
                            <option value="0.9">0.9</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="statusSelect">状态过滤:</label>
                        <select id="statusSelect" class="select-input">
                            <option value="">全部</option>
                            <option value="active" selected>活跃</option>
                            <option value="deprecated">已弃用</option>
                            <option value="inactive">非活跃</option>
                        </select>
                    </div>
                </div>

                <div id="searchResults" class="search-results">
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3 class="empty-title">开始检索</h3>
                        <p class="empty-description">输入关键词或问题，系统将基于语义相似度检索相关内容</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2025 RAG 系统. 基于 spec-workflow 驱动开发</p>
        </footer>
    </div>

    <script src="/static/js/search.js"></script>
</body>
</html>
