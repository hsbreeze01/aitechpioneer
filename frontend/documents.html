<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档管理 - RAG 系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header" role="banner">
            <div class="header-content">
                <a href="/index.html" class="logo" aria-label="RAG 系统首页">
                    <span class="logo-text">RAG 系统</span>
                </a>
                <nav class="nav" role="navigation" aria-label="主导航">
                    <a href="/index.html" class="nav-link">首页</a>
                    <a href="/documents.html" class="nav-link active" aria-current="page">文档管理</a>
                    <a href="/upload.html" class="nav-link">上传文档</a>
                    <a href="/qa.html" class="nav-link">智能问答</a>
                    <a href="/search.html" class="nav-link">智能检索</a>
                    <a href="/chunks.html" class="nav-link">Chunk 管理</a>
                </nav>
            </div>
        </header>

        <main class="main" role="main">
            <section class="documents-section" aria-labelledby="documents-title">
                <div class="section-header">
                    <div class="section-title-group">
                        <h1 id="documents-title" class="section-title">文档列表</h1>
                        <p class="section-description">管理您的所有文档</p>
                    </div>
                    <a href="/upload.html" class="btn btn-primary" aria-label="上传新文档">上传文档</a>
                </div>

                <div id="documentsList" class="documents-list" role="list" aria-live="polite">
                    <div class="loading" role="status" aria-label="正在加载文档列表">加载中...</div>
                </div>

                <div id="emptyState" class="empty-state hidden" role="status">
                    <div class="empty-icon" aria-hidden="true">
                        <img src="/static/icons/document-plus.svg" alt="" class="icon-svg-large">
                    </div>
                    <h2 class="empty-title">暂无文档</h2>
                    <p class="empty-description">开始上传您的第一个文档吧</p>
                    <a href="/upload.html" class="btn btn-primary" aria-label="上传第一个文档">上传文档</a>
                </div>
            </section>
        </main>

        <footer class="footer" role="contentinfo">
            <div class="footer-content">
                <p>&copy; 2025 RAG 系统. 基于 spec-workflow 驱动开发</p>
            </div>
        </footer>
    </div>

    <script src="/static/js/documents.js"></script>
</body>
</html>
