<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传文档 - RAG 系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">RAG 系统</h1>
                <nav class="nav">
                    <a href="/index.html" class="nav-link">首页</a>
                    <a href="/documents.html" class="nav-link">文档管理</a>
                    <a href="/upload.html" class="nav-link active">上传文档</a>
                    <a href="/qa.html" class="nav-link">智能问答</a>
                </nav>
            </div>
        </header>

        <main class="main">
            <section class="upload-section">
                <h2 class="section-title">上传文档</h2>
                <p class="section-description">支持 PDF、TXT、Markdown、DOCX 格式</p>

                <div class="upload-container">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📤</div>
                        <p class="upload-text">拖拽文件到此处或点击上传</p>
                        <p class="upload-hint">支持 PDF、TXT、Markdown、DOCX 文件</p>
                        <input type="file" id="fileInput" accept=".pdf,.txt,.md,.docx" hidden>
                    </div>

                    <div class="upload-options">
                        <div class="form-group">
                            <label class="form-label">文档标题</label>
                            <input type="text" id="documentTitle" class="form-input" placeholder="输入文档标题（可选）">
                        </div>
                        <div class="form-group">
                            <label class="form-label">文档描述</label>
                            <textarea id="documentDescription" class="form-textarea" placeholder="输入文档描述（可选）"></textarea>
                        </div>
                    </div>

                    <button id="uploadBtn" class="btn btn-primary btn-large">开始上传</button>
                </div>

                <div id="uploadProgress" class="upload-progress hidden">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">正在处理...</p>
                </div>

                <div id="uploadResult" class="upload-result hidden">
                    <div class="result-success">
                        <div class="result-icon">✅</div>
                        <h3 class="result-title">上传成功</h3>
                        <p class="result-message" id="resultMessage"></p>
                        <div class="result-actions">
                            <a href="/documents.html" class="btn btn-secondary">查看文档</a>
                            <button id="uploadAnother" class="btn btn-primary">上传更多</button>
                        </div>
                    </div>
                </div>

                <div class="upload-tasks-section">
                    <div class="tasks-header">
                        <h3 class="tasks-title">上传任务列表</h3>
                        <button id="refreshTasksBtn" class="btn btn-secondary btn-small">刷新</button>
                    </div>
                    <div id="uploadTasksList" class="upload-tasks-list">
                        <div class="empty-tasks">
                            <div class="empty-icon">📋</div>
                            <p class="empty-text">暂无上传任务</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2025 RAG 系统. 基于 spec-workflow 驱动开发</p>
        </footer>
    </div>

    <script src="/static/js/upload.js"></script>
</body>
</html>
