<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员控制台 - RAG 系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">RAG 系统 - 管理员控制台</h1>
                <nav class="nav">
                    <a href="/index.html" class="nav-link">首页</a>
                    <a href="/documents.html" class="nav-link">文档管理</a>
                    <a href="/chunks.html" class="nav-link">Chunk 管理</a>
                    <a href="/qa.html" class="nav-link">智能问答</a>
                    <a href="/admin.html" class="nav-link active">管理员控制台</a>
                </nav>
            </div>
        </header>

        <main class="main">
            <section class="admin-section">
                <div class="section-header">
                    <h2 class="section-title">不满意的问答记录</h2>
                    <div class="section-actions">
                        <button id="refreshButton" class="btn btn-small btn-primary" aria-label="刷新记录">刷新</button>
                        <a href="/chunks.html" class="btn btn-small btn-secondary">去 Chunk 管理</a>
                    </div>
                </div>

                <div id="unsatisfiedRecords" class="unsatisfied-records">
                    <div class="loading">加载中...</div>
                </div>

                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon">
                        <img src="/static/icons/check-circle.svg" alt="" class="icon-svg-large" aria-hidden="true">
                    </div>
                    <h3 class="empty-title">暂无不满意的记录</h3>
                    <p class="empty-description">所有用户都对答案满意，系统运行良好！</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2025 RAG 系统. 基于 spec-workflow 驱动开发</p>
        </footer>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
